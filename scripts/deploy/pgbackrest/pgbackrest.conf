# pgBackRest settings for the "postgres" service in docker-compose.prod.yml, mounted read-only
# at /etc/pgbackrest/pgbackrest.conf. Nothing secret and nothing server-specific lives here:
# the Storage Box address, user and path, the database user and the encryption passphrase come
# from environment variables that Compose fills in from .env.prod (PGBACKREST_<OPTION>):
#
#   PGBACKREST_REPO1_SFTP_HOST         Storage Box host, for example uXXXXXX.your-storagebox.de
#   PGBACKREST_REPO1_SFTP_HOST_PORT    23 for a Hetzner Storage Box (SFTP over port 23)
#   PGBACKREST_REPO1_SFTP_HOST_USER    Storage Box user (or sub-account), for example uXXXXXX
#   PGBACKREST_REPO1_PATH              absolute path on the Storage Box, for example /home/pgbackrest
#   PGBACKREST_REPO1_CIPHER_PASS       encryption passphrase (also keep it in the password manager:
#                                      without it the backups cannot be read)
#   PGBACKREST_PG1_USER                the PostgreSQL superuser (POSTGRES_USER); the image has no
#                                      "postgres" role
#
# What it does: every finished WAL segment (at least one a minute, archive_timeout=60) is pushed
# to the Storage Box, plus a full backup every Sunday and a differential one on other days
# (scripts/deploy/crontab.example). Backups are kept for 14 days, the period in the privacy
# policy: change both together or neither.

[global]
# Off-server repository on the Hetzner Storage Box, over SFTP, encrypted before it leaves.
repo1-type=sftp
repo1-sftp-private-key-file=/etc/konnected-backup/id_ed25519
repo1-sftp-public-key-file=/etc/konnected-backup/id_ed25519.pub
repo1-sftp-known-host=/etc/konnected-backup/known_hosts
repo1-sftp-host-key-check-type=strict
repo1-sftp-host-key-hash-type=sha256
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-block=y

# Keep every backup (and the WAL to restore to any moment) of the last 14 days.
repo1-retention-full-type=time
repo1-retention-full=14

compress-type=zst
process-max=2
start-fast=y

# WAL is pushed in the background. If the Storage Box is unreachable for long, WAL piles up on
# the server's disk; above 4 GiB it is dropped (PostgreSQL keeps running, point-in-time restore
# has a gap until the next full backup) rather than filling the disk and stopping the database.
archive-async=y
archive-push-queue-max=4GiB
spool-path=/var/lib/postgresql/pgbackrest-spool

log-level-console=info
log-level-stderr=warn
log-level-file=off

[konnected]
# PostgreSQL 18 image: data directory inside the /var/lib/postgresql volume.
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
