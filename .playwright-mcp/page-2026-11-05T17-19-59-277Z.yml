        - paragraph [ref=e5]: 'Thirty-one screens, many with several states, in ten visual identities, in three sets, all in the teal palette. Set 1 puts each page title on a deep teal field. Set 2 builds on Harbour, the main draft. Set 3 is Harbour and Estuary with an account menu: Profile leaves the navigation bar, and pressing the name at the top right opens Profile, Settings, Help and Log out. In Sets 1 and 2 the name at the top right opens Settings. Where a screen has several states, a State switch appears under the controls. Every identity uses SF and a floating glass navigation bar. Everything shown is example data. Pick an identity, pick a screen, then click through the mock.'
