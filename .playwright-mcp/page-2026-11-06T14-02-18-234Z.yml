                        - heading "Root server or vServer - which is the best option?" [level=2] [ref=e628]
                        - generic [ref=e630]:
                            - paragraph [ref=e631]:
                                - text: A root server, also known as a dedicated server, belongs exclusively to a single user and offers
                                - strong [ref=e632]: dedicated hardware resources
                                - text: such as CPU, RAM and storage space. A root server allows complete administrative control over the server configuration and is scalable.
                            - paragraph [ref=e633]:
                                - text: In contrast, vServers are virtual machines that share all resources such as CPU, RAM and storage space with all other users. Control over the server configuration is therefore more limited than with a root server. Due to virtualization,
                                - strong [ref=e634]: vServers are generally less expensive
                                - text: and less powerful than root servers.
                            - paragraph [ref=e635]:
                                - text: The choice between a root server and a vServer depends on the specific requirements and budget considerations. For compute-intensive projects that do not require dedicated hardware, we recommend
